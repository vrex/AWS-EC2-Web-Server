<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecodeLabs | Project 2</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            background:#ffffff;
            padding:45px;
            border-radius:18px;
            width:500px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,0.35);
        }

        .logo{
            font-size:60px;
            margin-bottom:15px;
        }

        h1{
            color:#2563eb;
            margin-bottom:10px;
            font-size:34px;
        }

        h2{
            color:#333;
            margin-bottom:20px;
            font-weight:500;
        }

        p{
            color:#666;
            margin:8px 0;
            font-size:17px;
        }

        .badge{
            display:inline-block;
            margin-top:25px;
            padding:12px 24px;
            background:#2563eb;
            color:white;
            border-radius:30px;
            font-weight:bold;
            font-size:15px;
        }

        .footer{
            margin-top:30px;
            font-size:13px;
            color:#888;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">☁️</div>

    <h1>Welcome to DecodeLabs</h1>

    <h2>AWS EC2 Web Server</h2>

    <p>🚀 Project 2 Completed Successfully</p>

    <p>Hosted on <strong>Amazon EC2</strong></p>

    <div class="badge">
        Cloud Computing Internship 2026
    </div>

    <div class="footer">
        Apache • Ubuntu • AWS EC2
    </div>

</div>

</body>
</html>
